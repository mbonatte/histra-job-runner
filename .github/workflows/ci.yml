name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      # Installing Runner also installs the pinned histra-python dependency.
      - run: python -m pip install -e ".[test]"
      - run: pytest --cov=histra_runner --cov-report=term-missing
      - run: python -c "import histra; print('histra-python', histra.__version__)"
      - run: histra-runner --version
