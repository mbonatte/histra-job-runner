[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "histra-job-runner"
version = "0.1.0"
description = "Local, network-agnostic job runner for HiStrA Bridges analyses."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mauricio Bonatte" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
histra-runner = "histra_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
