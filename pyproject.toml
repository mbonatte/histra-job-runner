[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "histra-job-runner"
version = "1.2.0"
description = "Continuous canonical HiStrA worker with histra-python as its built-in default solver"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Maurício Bonatte"}]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "histra-python @ git+https://github.com/mbonatte/histra-python.git@12b82d9b601d6eee6566d1f9e9c0a42815d2cef4",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
histra-runner = "histra_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["histra_runner"]
omit = ["src/histra_runner/cli.py"]

[tool.coverage.report]
show_missing = true
fail_under = 88
