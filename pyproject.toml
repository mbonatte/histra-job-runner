[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "histra-job-runner"
version = "0.3.0"
description = "Local HiStrA job runner with an HTTPS pull-worker adapter."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mauricio Bonatte" }]
dependencies = ["httpx>=0.27,<1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
histra-runner = "histra_runner.cli:main"
histra-worker = "histra_runner.network_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
