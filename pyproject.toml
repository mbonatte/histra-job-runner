[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "histra-job-runner"
version = "1.0.0"
description = "Secure HiStrA package validator, execution adapter, and network worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
histra-runner = "histra_runner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/histra_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["histra_runner"]

[tool.coverage.report]
show_missing = true
fail_under = 88
